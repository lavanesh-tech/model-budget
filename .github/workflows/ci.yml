name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend and migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: modelbudget_ci
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_DB: modelbudget_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modelbudget_ci -d modelbudget_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: modelbudget_ci
      POSTGRES_PASSWORD: ci-only-postgres-password
      POSTGRES_DB: modelbudget_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      ADMIN_API_KEY: ci-only-admin-key-not-a-secret
      OTEL_ENABLED: "false"
      OPENAI_MODEL: gpt-5-mini
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install \
            "fastapi>=0.141" \
            "uvicorn[standard]>=0.52" \
            "pydantic-settings>=2.0" \
            "sqlalchemy>=2.0" \
            "psycopg[binary]>=3.1" \
            "alembic>=1.13" \
            "argon2-cffi>=23.1" \
            "openai>=2.0.0" \
            "redis>=5.0" \
            "prometheus-client>=0.20" \
            "opentelemetry-api>=1.27,<2" \
            "opentelemetry-sdk>=1.27,<2" \
            "opentelemetry-exporter-otlp-proto-http>=1.27,<2" \
            "httpx>=0.27,<1"
          python -m pip check

      - name: Compile tracked Python files
        run: |
          mapfile -d '' files < <(git ls-files -z -- '*.py')
          python -m py_compile "${files[@]}"

      - name: Apply migrations and check schema drift
        run: |
          alembic upgrade head
          alembic check

      - name: Run committed backend verification suites
        run: |
          python -m scripts.check_prompt_versions
          python -m scripts.check_tracing
          python -m scripts.check_admin_dashboard

  dashboard:
    name: Dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.11.0"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Type-check dashboard
        working-directory: dashboard
        run: npm run typecheck

      - name: Run dashboard security tests
        working-directory: dashboard
        run: node --test tests/security.test.mjs

      - name: Run dashboard HTTP checks
        working-directory: dashboard
        run: node scripts/check_dashboard_http.mjs

      - name: Build dashboard
        working-directory: dashboard
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  containers:
    name: Production container builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build gateway image
        run: docker build --pull --tag modelbudget-gateway:ci .

      - name: Build dashboard image
        run: docker build --pull --tag modelbudget-dashboard:ci dashboard
